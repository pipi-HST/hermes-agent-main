name: Fork docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fork-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fork-delta:
    name: fork delta table is current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Check generated fork table
        # CI checks the checked-out tree (working tree == HEAD there).  Do not
        # use --rev HEAD locally: CRLF checkout differences make it look stale.
        run: python scripts/fork_delta.py --check
