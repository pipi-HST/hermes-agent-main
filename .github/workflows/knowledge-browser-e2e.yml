name: Knowledge Browser E2E

on:
  push:
    branches: [main]
    paths:
      - 'web/e2e/**'
      - 'web/src/**'
      - 'web/scripts/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/playwright.config.ts'
      - 'hermes_cli/web_server.py'
      - '.github/workflows/knowledge-browser-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/e2e/**'
      - 'web/src/**'
      - 'web/scripts/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/playwright.config.ts'
      - 'hermes_cli/web_server.py'
      - '.github/workflows/knowledge-browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run complete knowledge browser acceptance
        working-directory: web
        run: npm run test:knowledge:complete

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: knowledge-browser-e2e-${{ github.run_id }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7
