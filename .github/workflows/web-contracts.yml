name: Web contracts

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-contracts.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-contracts.yml"

permissions:
  contents: read

concurrency:
  group: web-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: dashboard contract scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run knowledge contract scripts
        run: |
          npm run check:knowledge-ai-revision
          npm run check:knowledge-capture-card-feedback
          npm run check:knowledge-editor-workflow
          npm run check:knowledge-layout-focus
          npm run check:knowledge-draft-routing
          npm run check:knowledge-outline
          npm run check:permanent-delete
          npm run check:research-progress
